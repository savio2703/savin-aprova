<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savin Aprova · Quiz e Simulados</title><meta name="theme-color" content="#0b0912"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" media="print" onload="this.media='all'"><link rel="icon" href="data:image/svg+xml,<svg class='selo' viewBox='0 0 120 120' aria-label='Selo Savin Aprova'><defs><linearGradient id='sg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ff8a5c'/><stop offset='.55' stop-color='%23f0567a'/><stop offset='1' stop-color='%239b7bff'/></linearGradient><path id='sc' d='M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0'/></defs><circle cx='60' cy='60' r='57' fill='url(%23sg)'/><circle cx='60' cy='60' r='51' fill='none' stroke='rgba(255,255,255,.55)' stroke-width='1.2' stroke-dasharray='2 3'/><circle cx='60' cy='60' r='33' fill='%23120e19'/><text font-family='Poppins,Arial,sans-serif' font-size='11.5' font-weight='800' letter-spacing='3.2' fill='%23fff'><textPath href='%23sc' startOffset='0'>SAVIN • APROVA • SAVIN • APROVA •</textPath></text><g transform='translate(60 60)' fill='%23fff'><path d='M0-19 L7-12 L0-5 L-7-12Z'/><path d='M0 5 L7 12 L0 19 L-7 12Z'/><path d='M-19 0 L-12-7 L-5 0 L-12 7Z'/><path d='M5 0 L12-7 L19 0 L12 7Z'/><path d='M0-6 L6 0 L0 6 L-6 0Z' fill='%23ff8a5c'/></g></svg>">
<style>
:root{--bg:#0b0912;--card:#15111e;--card2:#1c1727;--bd:rgba(255,255,255,.08);--tx:#f5f1fa;--mut:#a59cba;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--acc:#ff7a62;--g:linear-gradient(135deg,#ff8a5c,#f0567a 55%,#9b7bff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.6 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 600px at 90% -15%,rgba(240,86,122,.16),transparent 60%),radial-gradient(900px 600px at -15% 115%,rgba(155,123,255,.15),transparent 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 70%)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 18px}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.marca .selo{width:42px;height:42px;filter:drop-shadow(0 6px 16px rgba(240,86,122,.35))}
.marca b{font-size:17px}.marca span{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:2.4px;margin-top:-3px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 26px;margin-bottom:18px;background:linear-gradient(140deg,rgba(255,138,92,.16),rgba(240,86,122,.10) 45%,rgba(155,123,255,.16));border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hero .selo{position:absolute;right:-26px;top:-26px;width:190px;height:190px;opacity:.95;transform:rotate(-12deg);filter:drop-shadow(0 18px 40px rgba(240,86,122,.35));animation:gira 60s linear infinite}
@keyframes gira{to{transform:rotate(348deg)}}
.hero h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.6px;max-width:72%}
.hero h1 em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#d5cde4;margin-top:8px;max-width:68%;font-size:14.5px}

.aud{margin-top:18px;text-align:left}.aud h3{font-size:18px;font-weight:800;margin:0 0 4px}
.aud .mats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.aud .mats div{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.aud .mats b{display:block;font-size:20px}.aud .mats span{font-size:12px;color:var(--mut)}
.aud .as{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin:8px 0}
.aud .as .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.aud .as .t b{font-size:15px}
.aud .as .pc{font-weight:800;white-space:nowrap}.aud .as .tm{font-size:12.5px;color:var(--mut);margin:6px 0 8px}
.aud .as .btn{padding:8px 12px;font-size:13.5px}.aud .top{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.08)}
.aud .selo-top{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;color:#fca5a5;margin-bottom:4px}
@media(max-width:560px){.hero h1{font-size:23px;max-width:78%}.hero p{max-width:100%}.hero .selo{width:130px;height:130px;right:-30px;top:-30px}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 90px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
header h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
header h1 span{background:linear-gradient(135deg,#ff7a62,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:20px}
.sub{color:var(--mut);font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(6px);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s}
button.card{text-align:left;width:100%}
button.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
.mat{position:relative;overflow:hidden;padding:22px}
.mat .tag{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.mat h2{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}
.mat .ico{position:absolute;right:16px;top:14px;font-size:40px;opacity:.9;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.mat:after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;background:radial-gradient(400px 160px at 100% 0,var(--glow,rgba(255,255,255,.06)),transparent 70%)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-size:13px;color:var(--mut)}
.btn{padding:12px 18px;border-radius:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--bd)}
.btn.pri{background:var(--g);border:0;color:#fff;box-shadow:0 8px 22px rgba(240,86,122,.3)}
.btn:disabled{opacity:.4;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0 22px}
.mode{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--bd);text-align:left}
.mode b{display:block;font-size:16px;margin-bottom:3px}.mode span{font-size:13px;color:var(--mut)}
.aula{display:flex;align-items:center;gap:14px}
.aula .num{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px}
.aula .info{flex:1;min-width:0}.aula .info b{display:block;font-size:15.5px}
.score{font-weight:800;font-size:15px;white-space:nowrap}
/* questão */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.07);margin-bottom:18px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff7a62,#a78bfa);transition:width .3s}
.qcard{padding:22px}
.qtipo{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:8px;display:inline-block;margin-bottom:12px}
.enun{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px;white-space:pre-line}
.qimg{margin:0 0 16px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--bd);text-align:center}
.qimg img{max-width:100%;max-height:460px;display:block;margin:0 auto;cursor:zoom-in}
.alts{display:grid;gap:10px}
.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);transition:all .15s;width:100%}
.alt:hover:not(:disabled){border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.07)}
.alt .l{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.08)}
.alt.ok{border-color:var(--ok);background:rgba(52,211,153,.12)}.alt.ok .l{background:var(--ok);color:#06281b}
.alt.err{border-color:var(--err);background:rgba(248,113,113,.12)}.alt.err .l{background:var(--err);color:#300}
.alt:disabled{cursor:default}
.alt .cm{display:none;margin-top:10px;font-size:15px;color:#f3eefa;line-height:1.5;padding:10px 12px;border-radius:10px;background:rgba(248,113,113,.10);border-left:4px solid var(--err)}.alt.show .cm{display:block}.alt .cm.c{background:rgba(52,211,153,.12);border-left-color:var(--ok)}
.cm .rot{display:block;font-size:11.5px;font-weight:800;letter-spacing:1.2px;margin-bottom:3px;color:#fca5a5}.cm.c .rot{color:#6ee7b7}.cm mark{background:none;color:#ffd36b;font-weight:800}
.alt .tx{flex:1}
.exp{margin-top:16px;padding:16px;border-radius:14px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.3);animation:in .25s}
.exp h4{font-size:14px;margin-bottom:6px}.exp p{color:#ddd6ee;font-size:15px}
.exp .src{margin-top:8px;font-size:13px;color:var(--mut)}
.resp{margin-top:6px;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);white-space:pre-line}
textarea{width:100%;min-height:110px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);color:var(--tx);font:inherit;resize:vertical}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.res{text-align:center;padding:30px 20px}
.ring{width:170px;height:170px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:38px;font-weight:800}
.list{display:grid;gap:8px;margin-top:18px;text-align:left}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14px;cursor:pointer}
.li .d{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:50;padding:16px}.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0 20px}
.stat .card{padding:16px}.stat b{display:block;font-size:26px;font-weight:800}.stat span{font-size:13px;color:var(--mut)}
.hide{display:none}
.toggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);padding:4px;border-radius:12px}.toggle button{padding:7px 12px;border-radius:9px;font-size:14px;color:var(--mut)}.toggle button.on{background:rgba(255,255,255,.1);color:var(--tx)}

.sim .caso{background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:14px 0;font-size:15px;color:#e2dbee}
.sim .caso h3{font-size:17px;margin-bottom:8px;color:var(--tx)}.sim .caso p{margin:0 0 6px}.sim .caso b{color:#fff}
.sim .q{margin:16px 0 6px}
.area{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:7px;margin-right:6px;background:rgba(255,255,255,.08)}
.a-hist{color:#f472b6}.a-emb{color:#a78bfa}.a-fis{color:#34d399}.a-bio{color:#fbbf24}.a-ana{color:#ff7a62}.a-neu{color:#60a5fa}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dl a{padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
.dl a:hover{border-color:rgba(255,255,255,.3)}
.nota{display:block;margin-top:6px;font-size:13px;color:#fde68a;border-left:2px solid #fbbf24;padding-left:8px}
.rec{font-size:12px;color:var(--mut);font-style:italic}
.scorebar{position:sticky;top:0;z-index:5;background:rgba(13,11,18,.92);backdrop-filter:blur(8px);padding:10px 0;margin:-6px 0 6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
@media(max-width:560px){.enun{font-size:16.5px}.qcard{padding:16px}.wrap{padding:16px 12px 90px}header h1{font-size:19px}}
</style></head><body><div class="wrap" id="app"><div style="min-height:80vh;display:grid;place-items:center;text-align:center;color:#a59cba;font:600 15px system-ui,sans-serif"><div><div style="width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#ff8a5c,#f0567a 55%,#9b7bff);animation:gira 1.2s linear infinite"></div>Savin Aprova<br><span style="font-weight:400;font-size:13px">carregando o quiz…</span></div></div></div>
<script>window.onerror=function(m,u,l){var a=document.getElementById('app');if(a&&!window.__ok)a.innerHTML='<div style="padding:24px;color:#f5f1fa;font:15px sans-serif">Não abriu neste navegador.<br><br><small style="color:#a59cba">Erro: '+String(m).replace(/</g,'&lt;')+' (linha '+l+')</small><br><br><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="padding:10px 14px;border-radius:10px;border:0;background:#f0567a;color:#fff">Limpar e tentar de novo</button></div>'};</script>
<script src="dados.js?v=d8e09c6c"></script><script>

const TIPO={mc:['Múltipla escolha','#60a5fa'],vf:['Verdadeiro ou falso','#fbbf24'],img:['Figura / lâmina','#f472b6'],caso:['Caso clínico','#34d399'],ed:['Estudo dirigido','#a78bfa']};
const L='ABCDEFGH';
const K='quizMed_v1';
let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){S={}} // {qid:{ok:bool,n:tentativas}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s); const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qid=(m,a,i)=>m+'.'+a+'.'+i;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function todas(m){const r=[];for(const a of DATA[m].aulas)a.q.forEach((q,i)=>r.push({m,a:a.n,i,q,aula:a.nome}));return r}
function stats(list){let f=0,o=0;for(const x of list){const s=S[qid(x.m,x.a,x.i)];if(s){f++;if(s.ok)o++}}return{tot:list.length,f,o,p:f?Math.round(o/f*100):0}}
function bar(p,cor){p=isFinite(p)?p:0;return `<div class="bar"><i style="width:${p}%;background:${cor}"></i></div>`}
const SELO=`<svg class="selo" viewBox="0 0 120 120" aria-label="Selo Savin Aprova"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset=".55" stop-color="#f0567a"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><path id="sc" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
<circle cx="60" cy="60" r="57" fill="url(#sg)"/><circle cx="60" cy="60" r="51" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="60" cy="60" r="33" fill="#120e19"/>
<text font-family="Poppins,Arial,sans-serif" font-size="11.5" font-weight="800" letter-spacing="3.2" fill="#fff"><textPath href="#sc" startOffset="0">SAVIN • APROVA • SAVIN • APROVA •</textPath></text>
<g transform="translate(60 60)" fill="#fff"><path d="M0-19 L7-12 L0-5 L-7-12Z"/><path d="M0 5 L7 12 L0 19 L-7 12Z"/><path d="M-19 0 L-12-7 L-5 0 L-12 7Z"/><path d="M5 0 L12-7 L19 0 L12 7Z"/><path d="M0-6 L6 0 L0 6 L-6 0Z" fill="#ff8a5c"/></g></svg>`;
const MARCA=`<div class="marca">${SELO}<div><b>Savin Aprova</b><span>QUIZ · SIMULADOS</span></div></div>`;
function head(t,back){return `<div class="topo">${MARCA}</div><header>${back?`<button class="back" onclick="${back}">‹</button>`:''}<div><h1>${t}</h1></div></header>`}

function home(){
  const all=Object.keys(DATA).flatMap(todas); const st=stats(all); const erros=all.filter(x=>S[qid(x.m,x.a,x.i)]&&!S[qid(x.m,x.a,x.i)].ok);
  app.innerHTML=`<div class="topo">${MARCA}</div><div class="hero">${SELO}<h1>Treine para a <em>PR2</em> até saber por que cada alternativa está errada.</h1><p>${st.tot} questões de Anatomia, Histologia/Embriologia e Fisiologia, com gabarito comentado em cada alternativa, e ${SIMS.length} simulados no formato da prova.</p></div>`+
  `<div class="stat"><div class="card"><b>${st.f}</b><span>respondidas</span></div><div class="card"><b style="color:var(--ok)">${st.p}%</b><span>de acerto</span></div><div class="card"><b style="color:var(--err)">${erros.length}</b><span>para revisar</span></div></div>
  <div class="grid">${Object.entries(DATA).map(([m,d])=>{const s=stats(todas(m));return `<button class="card mat" style="--glow:${d.cor}33" onclick="materia('${m}')"><span class="ico">${({anato:'🫀',histo:'🔬',fisio:'⚡'})[m]}</span><span class="tag" style="background:${d.cor}"></span><span class="sub">${d.aulas.length} aulas · ${s.tot} questões</span><h2>${d.nome}</h2><div class="row"><span class="chip">${s.f}/${s.tot} feitas</span><span class="chip" style="color:${s.f?(s.p>=70?'var(--ok)':'var(--warn)'):'var(--mut)'}">${s.f?s.p+'% de acerto':'não começado'}</span></div>${bar(s.f/s.tot*100,d.cor)}</button>`}).join('')}</div>
  <button class="card mat" style="width:100%;margin-top:14px;--glow:#60a5fa33" onclick="simulados()"><span class="ico">📝</span><span class="tag" style="background:#60a5fa"></span><span class="sub">${SIMS.length} simulados · prova + gabarito comentado em PDF</span><h2>Simulados no formato da PR2</h2><div class="row"><span class="chip">casos clínicos</span><span class="chip">alternativas de Histo, Embrio, Fisio e Anato</span></div></button>
  <div class="modes" style="margin-top:22px"><button class="mode" onclick="mixTela()"><b>🎯 Quizzes misturados</b><span>as 3 matérias juntas + auditoria do que você mais errou</span></button>
  <button class="mode" ${erros.length?'':'disabled style="opacity:.45"'} onclick="revErros()"><b>🔁 Revisar meus erros</b><span>${erros.length} questões que você errou</span></button>
  <button class="mode" onclick="if(confirm('Apagar todo o progresso?')){S={};save();home()}"><b>🧹 Zerar progresso</b><span>começar do zero</span></button></div>`;
}
const AREA=a=>{const x=(a||'').toLowerCase();return x.startsWith('hist')?'a-hist':x.startsWith('emb')?'a-emb':x.startsWith('fis')?'a-fis':x.startsWith('bio')?'a-bio':x.startsWith('neuro')?'a-neu':'a-ana'};
function dlink(k,nome){return PDFS[k]?(PDFS[k].startsWith('pdf/')?`<a href="${PDFS[k]}" target="_blank" rel="noopener">`:`<a download="${esc(nome)}.pdf" href="data:application/pdf;base64,${PDFS[k]}">`)+`⬇ Baixar ${esc(nome.split(' - ').slice(1).join(' - '))} (PDF)</a>`:''}
function simulados(){
  app.innerHTML=head('Simulados <span>no formato da PR2</span>','home()')+`<p class="sub" style="margin:-12px 0 16px">Casos clínicos com alternativas de Histologia, Embriologia, Fisiologia/Bioquímica e Anatomia. Faça online ou baixe a prova e o gabarito comentado em PDF.</p>`+
  `<div class="grid" style="grid-template-columns:1fr">${SIMS.map((x,k)=>{const st=JSON.parse(localStorage.getItem('sim_'+x.n)||'{}');const f=Object.keys(st).length,o=Object.values(st).filter(v=>v).length;
   return `<div class="card"><div class="row" style="justify-content:space-between"><div><b style="font-size:17px">${esc(x.titulo)}</b><div class="sub">${x.casos.length} casos clínicos · ${x.casos.flatMap(c=>c.questoes).length} questões${f?` · ${o}/${f} certas`:''}</div></div><button class="btn pri" onclick="abreSim(${k})">Fazer online</button></div>
   <div class="dl">${dlink('s'+x.n+'p','Simulado '+x.n+' - Prova')}${dlink('s'+x.n+'g','Simulado '+x.n+' - Gabarito comentado')}</div></div>`}).join('')}</div>`;scrollTo(0,0);
}
var SIMA=null;
function achaQ(x,n){return x.casos.flatMap(c=>c.questoes).find(q=>q.n===n)}
function abreSim(k){const x=SIMS[k];SIMA=k;
  let h=head(esc(x.titulo),'simulados()')+`<div class="sim">${x.aviso?`<p class="sub" style="margin-bottom:10px">${esc(x.aviso)}</p>`:''}<div class="scorebar"><span class="sub" id="placar"></span><button class="btn" onclick="if(confirm('Zerar suas respostas deste simulado?')){localStorage.removeItem('sim_${x.n}');localStorage.removeItem('simr_${x.n}');abreSim(${k})}">Refazer</button></div>
  <div class="dl" style="margin-bottom:6px">${dlink('s'+x.n+'p','Simulado '+x.n+' - Prova')}${dlink('s'+x.n+'g','Simulado '+x.n+' - Gabarito comentado')}</div>`;
  x.casos.forEach(c=>{h+=`<div class="caso"><h3>${esc(c.titulo)}</h3>${c.texto.map(([t,v])=>`<p>${t?`<b>${esc(t)}:</b> `:''}${esc(v)}</p>`).join('')}</div>`;
    c.questoes.forEach(q=>{h+=`<div class="card qcard q" id="q${q.n}"><span class="qtipo" style="background:${q.tipo==='obj'?'#60a5fa22;color:#60a5fa':'#a78bfa22;color:#a78bfa'}">${q.tipo==='obj'?'Questão '+String(q.n).padStart(2,'0'):'Discursiva '+String(q.n).padStart(2,'0')}</span>${q.reconstrucao?' <span class="rec">[reconstrução]</span>':''}<div class="enun">${esc(q.enunciado)}</div>`;
      if(q.tipo==='obj'){h+=`<div class="alts">${q.alts.map((a,j)=>`<button class="alt" id="q${q.n}a${j}" onclick="respSim(${q.n},${j})"><span class="l">${'abcd'[j]}</span><span class="tx">${esc(a.texto)}${a.reconstrucao?' <span class="rec">[reconstrução]</span>':''}<span class="cm ${a.correta?'c':''}"><span class="area ${AREA(a.area)}">${esc(a.area)}</span>${a.correta?'✔ CORRETA. ':'✘ ERRADA. '}${esc(a.comentario)}${a.nota?`<span class="nota">${esc(a.nota)}</span>`:''}</span></span></button>`).join('')}</div>`}
      else{h+=q.itens.map((it,j)=>`<div style="margin:10px 0"><div><b>${it.letra?it.letra+') ':''}</b>${esc(it.texto)} ${it.pontos?`<span class="sub">(${it.pontos})</span>`:''}</div><div id="r${q.n}_${j}" class="hide resp" style="margin-top:8px">${esc(it.resposta)}${it.nota?`<span class="nota">${esc(it.nota)}</span>`:''}</div></div>`).join('')+`<div class="foot"><span></span><button class="btn" onclick="this.remove();document.querySelectorAll('[id^=r${q.n}_]').forEach(e=>e.classList.remove('hide'))">Mostrar resposta-modelo</button></div>`}
      h+='</div>'})});
  h+=`<div class="row" style="justify-content:center;margin:20px 0"><button class="btn" onclick="simulados()">Voltar aos simulados</button></div></div>`;
  app.innerHTML=h;const sv=JSON.parse(localStorage.getItem('simr_'+x.n)||'{}');Object.entries(sv).forEach(([n,j])=>marcaSim(x,+n,j));placar();scrollTo(0,0)}
function marcaSim(x,n,j){const q=achaQ(x,n);const c=q.alts.findIndex(a=>a.correta);q.alts.forEach((_,k)=>{const b=$(`#q${n}a${k}`);if(!b)return;b.disabled=true;b.classList.add('show');if(k===c)b.classList.add('ok');else if(k===j)b.classList.add('err')});return j===c}
function respSim(n,j){const x=SIMS[SIMA];const ok=marcaSim(x,n,j);const st=JSON.parse(localStorage.getItem('sim_'+x.n)||'{}');st[n]=ok;localStorage.setItem('sim_'+x.n,JSON.stringify(st));const sv=JSON.parse(localStorage.getItem('simr_'+x.n)||'{}');sv[n]=j;localStorage.setItem('simr_'+x.n,JSON.stringify(sv));placar()}
function placar(){const x=SIMS[SIMA];const st=JSON.parse(localStorage.getItem('sim_'+x.n)||'{}');const t=x.casos.flatMap(c=>c.questoes).filter(q=>q.tipo==='obj').length;const f=Object.keys(st).length,o=Object.values(st).filter(v=>v).length;const e=$('#placar');if(e)e.textContent=`Objetivas: ${f}/${t} respondidas · ${o} certas${f?` (${Math.round(o/f*100)}%)`:''}`}


function cmt(t,ok){t=String(t).replace(/^\s*(CORRETA|ERRADA|INCORRETA)[.:]?\s*/i,'');const h=esc(t).replace(/(^|[^A-Za-zÀ-ÿ0-9])([A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ0-9+]{2,})(?![A-Za-zÀ-ÿ0-9])/g,'$1<mark>$2</mark>');
  return `<span class="cm ${ok?'c':''}"><span class="rot">${ok?'✔ CORRETA, PORQUE':'✘ ERRADA, PORQUE'}</span>${h}</span>`}
function hs(str){let h=1779033703;for(const ch of String(str))h=Math.imul(h^ch.charCodeAt(0),3432918353),h=h<<13|h>>>19;return h>>>0}
function rshuf(a,seed){let x=hs(seed);const r=()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mixes(mat){const pool=(mat?todas(mat):Object.keys(DATA).flatMap(todas)).filter(x=>x.q.t!=='ed');
  const gs=(mat?DATA[mat].aulas.map(a=>pool.filter(x=>x.a===a.n)):Object.keys(DATA).map(m=>pool.filter(x=>x.m===m))).map((g,k)=>rshuf(g,'mix'+(mat||'g')+k));
  const fila=[];for(let i=0;gs.some(g=>i<g.length);i++)gs.forEach(g=>{if(i<g.length)fila.push(g[i])});
  const n=Math.max(1,Math.round(fila.length/30)),tam=Math.ceil(fila.length/n),out=[];for(let k=0;k<n;k++)out.push(rshuf(fila.slice(k*tam,(k+1)*tam),'ord'+(mat||'g')+k));return out}
function mixBotoes(mat){return mixes(mat).map((l,k)=>{const key=(mat||'geral')+'_'+(k+1),sc=localStorage.getItem('mix_'+key);
  return `<button class="mode" onclick="abreMix('${mat||''}',${k})"><b>🎯 Quiz misturado ${k+1}</b><span>${l.length} questões${sc?` · você fez: ${sc}`:''}</span></button>`}).join('')}
function abreMix(mat,k){const l=mixes(mat||null)[k];iniciar(l,`Quiz misturado ${k+1}`+(mat?' · '+DATA[mat].nome:''),(mat||'geral')+'_'+(k+1))}
function mixTela(){app.innerHTML=head('Quizzes misturados <span>3 matérias</span>','home()')+`<p class="sub" style="margin:-12px 0 16px">Questões das 3 matérias, com auditoria dos erros no final. O Quiz 1 é igual para todo mundo, então dá pra comparar com os amigos.</p><div class="modes">${mixBotoes(null)}</div>`;scrollTo(0,0)}
function revErros(m){const all=(m?todas(m):Object.keys(DATA).flatMap(todas)).filter(x=>S[qid(x.m,x.a,x.i)]&&!S[qid(x.m,x.a,x.i)].ok);if(all.length)iniciar(shuffle(all),'Revisão de erros')}
function materia(m){
  const d=DATA[m]; const s=stats(todas(m));
  app.innerHTML=head(d.nome,'home()')+
  `<div class="card" style="margin-bottom:16px;border-color:rgba(255,122,98,.45);background:linear-gradient(140deg,rgba(255,138,92,.14),rgba(155,123,255,.10))"><b style="font-size:17px">🎯 Quizzes misturados de ${esc(d.nome)}</b><p class="sub" style="margin:4px 0 10px">Todas as aulas misturadas, com auditoria do que você mais errou no final. Iguais para todo mundo: o Quiz 1 do seu amigo é o mesmo que o seu.</p><div class="modes" style="margin:0">${mixBotoes(m)}</div></div>
  <div class="modes">
   <button class="mode" onclick="revErros('${m}')"><b>🔁 Revisar erros</b><span>só o que você errou aqui</span></button>
   <button class="mode" onclick="iniciar(todas('${m}').filter(x=>x.q.t==='ed'),'Estudos dirigidos · ${esc(d.nome)}')" ${todas(m).some(x=>x.q.t==='ed')?'':'disabled style="opacity:.45"'}><b>📝 Estudos dirigidos</b><span>${todas(m).filter(x=>x.q.t==='ed').length} perguntas do ED</span></button></div>
  <div class="grid" style="grid-template-columns:1fr">${d.aulas.map(a=>{const l=todas(m).filter(x=>x.a===a.n);const t=stats(l);return `<button class="card aula" onclick="iniciar(rshuf(todas('${m}').filter(x=>x.a===${a.n}),'aula${m}${a.n}'),'Aula ${a.n} · ${esc(a.nome)}')"><div class="num" style="background:${d.cor}22;color:${d.cor}">${a.n}</div><div class="info"><b>${esc(a.nome)}</b><span class="sub">${t.tot} questões · ${t.f} feitas</span>${bar(t.f/t.tot*100,d.cor)}</div><div class="score" style="color:${t.f?(t.p>=70?'var(--ok)':'var(--warn)'):'var(--mut)'}">${t.f?t.p+'%':'—'}</div></button>`}).join('')}</div>`;
}
var R=null; // rodada
function iniciar(lista,titulo,key){if(!lista.length)return;R={lista,titulo,key,i:0,res:[],volta:location.hash};mostra();scrollTo(0,0)}
function mostra(){
  const x=R.lista[R.i],q=x.q,[tn,tc]=TIPO[q.t]||TIPO.mc,d=DATA[x.m];
  const alts=q.t==='ed'?`<textarea id="ta" placeholder="Escreva (ou pense) sua resposta e depois revele a resposta-modelo..."></textarea><div class="foot"><span></span><button class="btn pri" onclick="revela()">Mostrar resposta</button></div>`:
   `<div class="alts">${q.a.map((a,j)=>`<button class="alt" id="a${j}" onclick="responde(${j})"><span class="l">${q.t==='vf'?(j?'F':'V'):L[j]}</span><span class="tx">${esc(a)}${q.k&&q.k[j]?cmt(q.k[j],j===q.c):''}</span></button>`).join('')}</div>`;
  app.innerHTML=head(esc(R.titulo),'sair()')+
  `<div class="qtop"><span class="sub">Questão ${R.i+1} de ${R.lista.length}</span><span class="chip">${esc(d.nome)} · Aula ${x.a}</span></div><div class="prog"><i style="width:${R.i/R.lista.length*100}%"></i></div>
  <div class="card qcard"><span class="qtipo" style="background:${tc}22;color:${tc}">${tn}${q.t==='ed'&&q.d?' · '+q.d:''}</span>
  ${q.i?`<div class="qimg"><img src="${IMGS[q.i].startsWith('img/')?IMGS[q.i]:'data:image/jpeg;base64,'+IMGS[q.i]}" loading="lazy" decoding="async" onclick="zoom(this.src)"></div>`:''}
  <div class="enun">${esc(q.e)}</div>${alts}<div id="exp"></div></div>`;
}
function exp(q,x){return `<div class="exp"><h4>${q.t==='ed'?'Resposta-modelo':'Para guardar'}</h4>${q.t==='ed'?`<div class="resp">${esc(q.r)}</div>`:''}${q.x?`<p style="margin-top:${q.t==='ed'?8:0}px">💡 ${esc(q.x)}</p>`:''}<div class="src">📍 Aula ${x.a} · ${esc(x.aula)}${q.g?' · '+esc(q.g):''}</div></div>`}
function responde(j){
  const x=R.lista[R.i],q=x.q,ok=j===q.c;
  q.a.forEach((_,k)=>{const b=$('#a'+k);b.disabled=true;b.classList.add('show');if(k===q.c)b.classList.add('ok');else if(k===j)b.classList.add('err')});
  registra(x,ok);$('#exp').innerHTML=exp(q,x)+prox();
}
function revela(){const x=R.lista[R.i],q=x.q;$('.foot').remove();$('#exp').innerHTML=exp(q,x)+`<div class="foot"><span class="sub">Como foi sua resposta?</span><div class="row"><button class="btn" onclick="auto(false)">❌ Errei</button><button class="btn" onclick="auto(true)" style="border-color:var(--ok)">✅ Acertei</button></div></div>`}
function auto(ok){registra(R.lista[R.i],ok);avanca()}
function registra(x,ok){const id=qid(x.m,x.a,x.i);S[id]={ok,n:((S[id]||{}).n||0)+1};save();R.res.push({x,ok})}
function prox(){return `<div class="foot"><span></span><button class="btn pri" onclick="avanca()">${R.i+1<R.lista.length?'Próxima →':'Ver resultado'}</button></div>`}
function avanca(){R.i++;if(R.i<R.lista.length){mostra();scrollTo(0,0)}else fim()}
function sair(){if(!R.res.length||confirm('Sair desta rodada? O que você já respondeu fica salvo.'))home()}
function fim(){
  const ok=R.res.filter(r=>r.ok).length,t=R.res.length;if(R.key)try{localStorage.setItem('mix_'+R.key,ok+'/'+t+' certas')}catch(e){}const p=t?Math.round(ok/t*100):0,cor=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--err)';
  const msg=p>=85?'Excelente! Domínio muito bom.':p>=70?'Bom resultado. Revise os erros para fechar.':p>=50?'No caminho. Vale rever as aulas dos erros.':'Hora de reassistir as aulas e tentar de novo.';
  app.innerHTML=head(esc(R.titulo),'home()')+`<div class="card res"><div class="ring" style="background:conic-gradient(${cor} ${p*3.6}deg,rgba(255,255,255,.08) 0)"><div>${p}%</div></div><h2>${ok} de ${t} certas</h2><p class="sub" style="margin-top:6px">${msg}</p>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="home()">Início</button>${t-ok?'<button class="btn pri" onclick="refazErros()">Refazer as erradas</button>':''}</div>
  ${auditoria()}<h3 style="font-size:16px;margin:20px 0 0;text-align:left">Questão por questão</h3><div class="list">${R.res.map((r,k)=>`<div class="li" onclick="this.querySelector('.det').classList.toggle('hide')"><span class="d" style="background:${r.ok?'var(--ok)':'var(--err)'}"></span><div><div>${k+1}. ${esc(r.x.q.e.slice(0,140))}${r.x.q.e.length>140?'…':''}</div><div class="det hide" style="margin-top:6px">${r.x.q.t!=='ed'?`<b style="color:var(--ok)">${L[r.x.q.c]}) ${esc(r.x.q.a[r.x.q.c])}</b><br>${(r.x.q.k||[]).map((c,j)=>`<span class="sub">${L[j]}: ${esc(c)}</span>`).join('<br>')}<br>`:''}<span class="sub">${esc(r.x.q.x||r.x.q.r||'')}</span></div></div></div>`).join('')}</div></div>`;scrollTo(0,0);
}

function misturado(mat){const pool=(mat?todas(mat):Object.keys(DATA).flatMap(todas)).filter(x=>x.q.t!=='ed');
  const grupos=mat?DATA[mat].aulas.map(a=>pool.filter(x=>x.a===a.n)):Object.keys(DATA).map(m=>pool.filter(x=>x.m===m));const por=Math.floor(30/grupos.length);let l=[];
  grupos.forEach(g=>{l=l.concat(shuffle(g).slice(0,por))});l=l.concat(shuffle(pool.filter(x=>!l.includes(x))).slice(0,30-l.length));
  iniciar(shuffle(l),mat?'Quiz misturado · '+DATA[mat].nome:'Quiz misturado')}
function treino(m,a){const l=todas(m).filter(x=>x.a===a&&x.q.t!=='ed');const st=x=>{const v=S[qid(x.m,x.a,x.i)];return v?(v.ok?2:0):1};
  return shuffle(l).sort((p,q)=>st(p)-st(q)).slice(0,30)}
function treinaAula(m,a){const au=DATA[m].aulas.find(z=>z.n===a);iniciar(shuffle(treino(m,a)),'Treino · '+au.nome)}
var AUD=[];
function treinaFraco(){let l=[];const tot=AUD.reduce((s,g)=>s+g.e,0);AUD.filter(g=>g.e).forEach(g=>{l=l.concat(treino(g.m,g.a).slice(0,Math.max(3,Math.round(30*g.e/tot))))});
  iniciar(shuffle(l).slice(0,30),'Quiz do que preciso estudar')}
function auditoria(){
  const G={};R.res.forEach(r=>{const x=r.x,k=x.m+'.'+x.a;(G[k]=G[k]||{m:x.m,a:x.a,nome:x.aula,t:0,e:0,temas:[]});G[k].t++;if(!r.ok){G[k].e++;if(x.q.g&&!G[k].temas.includes(x.q.g))G[k].temas.push(x.q.g)}});
  AUD=Object.values(G).sort((p,q)=>q.e-p.e||(q.e/q.t)-(p.e/p.t));if(AUD.length<2)return '';
  const M={};R.res.forEach(r=>{const m=r.x.m;(M[m]=M[m]||{t:0,o:0});M[m].t++;if(r.ok)M[m].o++});
  const err=AUD.filter(g=>g.e);
  return `<div class="aud"><h3>🔎 Auditoria do seu quiz</h3><p class="sub">${err.length?'Onde você mais errou, do pior para o melhor. Toque em treinar para fazer um quiz só daquele assunto.':'Você não errou nenhuma. Domínio em todos os assuntos que caíram.'}</p>
  ${Object.keys(M).length<2?'':`<div class="mats">${Object.entries(M).map(([m,v])=>{const p=Math.round(v.o/v.t*100);return `<div><b style="color:${p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--err)'}">${p}%</b><span>${esc(DATA[m].nome.split(' ')[0])} · ${v.o}/${v.t}</span></div>`}).join('')}</div>`}
  ${err.length>1?`<button class="btn pri" style="width:100%;margin-bottom:6px" onclick="treinaFraco()">🎯 Quiz do que eu preciso estudar (30 questões dos assuntos que errei)</button>`:''}
  ${AUD.map((g,k)=>{const p=Math.round((g.t-g.e)/g.t*100),d=DATA[g.m];return `<div class="as ${k===0&&g.e?'top':''}">${k===0&&g.e?'<span class="selo-top">MAIS ERROU</span>':''}<div class="t"><b><span style="color:${d.cor}">●</span> ${esc(g.nome)}</b><span class="pc" style="color:${g.e?(p>=50?'var(--warn)':'var(--err)'):'var(--ok)'}">${g.e?`errou ${g.e} de ${g.t}`:`${g.t}/${g.t} certas`}</span></div>
   <div class="tm">${esc(d.nome)} · Aula ${g.a}${g.temas.length?' · errou em: '+g.temas.map(esc).join(', '):''}</div>${bar(p,g.e?(p>=50?'var(--warn)':'var(--err)'):'var(--ok)')}
   ${g.e?`<div style="margin-top:10px"><button class="btn" onclick="treinaAula('${g.m}',${g.a})">Treinar este assunto →</button></div>`:''}</div>`}).join('')}</div>`}
function refazErros(){iniciar(shuffle(R.res.filter(r=>!r.ok).map(r=>r.x)),'Refazendo erradas')}
function zoom(src){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${src}">`;z.onclick=()=>z.remove();document.body.appendChild(z)}
document.addEventListener('keydown',e=>{if(!R||!$('.alts'))return;const k=e.key.toUpperCase();const j=L.indexOf(k);if(j>=0&&$('#a'+j)&&!$('#a'+j).disabled)responde(j);if(e.key==='Enter'&&$('.btn.pri'))$('.btn.pri').click()});
home();window.__ok=1;
</script><footer style="text-align:center;color:#6f6683;font-size:12px;padding:0 0 30px">Savin Aprova · material de estudo · progresso salvo só neste aparelho</footer></body></html>
